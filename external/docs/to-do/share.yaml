paths:
  /todo/{id}/share:
    post:
      tags:
        - ToDo
      summary: Share a ToDo item with multiple users
      description: Share a ToDo item with a list of users by their IDs.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the ToDo item to be shared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userIds
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: A list of user IDs to share the ToDo item with.
      responses:
        '201':
          description: ToDo item successfully shared with users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates whether the sharing was successful
        '404':
          description: ToDo or user(s) not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message explaining which entities were not found
